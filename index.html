<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --primary: #1E40AF;
    --primary-hover: #1e3a8a;
    --bg-color: #f1f5f9;
    --card-bg: #ffffff;
    --text-main: #1e293b;
    --text-muted: #64748b;

}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
body { background: var(--bg-color); min-height: 100vh; color: var(--text-main); }
.header { background: linear-gradient(135deg, #0F172A, #1E3A8A); color: white; padding: 24px 15px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
.header h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
.header h2 { font-size: 14px; color: #BFDBFE; font-weight: 400; }
.status { background: #172554; color: #BFDBFE; padding: 10px 20px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
.container { max-width: 900px; margin: 20px auto; padding: 0 15px; }
.card { background: var(--card-bg); border-radius: 16px; padding: 24px; margin-bottom: 20px; box-shadow: 0 8px 25px -5px rgba(0,0,0,0.05); border: 1px solid var(--border); }
.card h3, .card h4 { margin-bottom: 16px; color: var(--primary); }
input, select { width: 100%; padding: 12px 15px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; outline: none; transition: all 0.3s; background: #f8fafc; margin-bottom: 10px; }
input:focus, select:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1); }
button { padding: 10px 18px; border-radius: 10px; border: none; cursor: pointer; font-weight: 700; font-size: 14px; transition: all 0.2s ease-in-out; }
button:active { transform: scale(0.96); }
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-hover); box-shadow: 0 4px 12px rgba(30,64,175,0.2); }
.btn-green { background: #DCFCE7; color: #166534; border: 1px solid #86EFAC; }
.btn-green:hover { background: #bbf7d0; }
.btn-yellow { background: #FEF9C3; color: #854D0E; border: 1px solid #FDE68A; }
.btn-yellow:hover { background: #fef08a; }
.btn-blue-light { background: #DBEAFE; color: #1E40AF; border: 1px solid #93C5FD; }

.btn-orange { background: #FFEDD5; color: #9A3412; border: 1px solid #FDBA74; }

.btn-red { background: #FEE2E2; color: #991B1B; border: 1px solid #FCA5A5; }

.btn-gray { background: #F1F5F9; color: #334155; border: 1px solid #CBD5E1; }

.teacher-card { display: flex; justify-content: space-between; align-items: center; gap: 15px; padding: 16px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; background: #fafafa; transition: background 0.3s; flex-wrap: wrap; }
.teacher-card:hover { background: #f8fafc; border-color: #cbd5e1; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
.teacher-info b { font-size: 15px; color: var(--text-main); }
.teacher-info div { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.tab-container { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.tab { padding: 10px 20px; border-radius: 25px; border: 1px solid var(--border); background: var(--card-bg); cursor: pointer; font-size: 14px; font-weight: 500; color: var(--text-muted); transition: all 0.3s; }
.tab:hover { background: #f8fafc; }
.tab.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 10px rgba(30, 64, 175, 0.2); }
table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; margin-top: 15px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
th, td { padding: 12px; text-align: right; border-bottom: 1px solid var(--border); }
th { background: #f8fafc; color: var(--text-muted); font-weight: 700; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #f1f5f9; }
.toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #0F172A; color: white; padding: 14px 28px; border-radius: 30px; font-size: 14px; font-weight: 500; display: none; z-index: 999; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-top: 12px; }
.stat-box { padding: 16px; border-radius: 12px; text-align: center; border: 1px solid transparent; }
.stat-box h3 { font-size: 24px; margin-bottom: 4px; }
</style>

معلم لغة عربية", "password": "10540082"}, {"id": "30044724", "name": "صهيب علي سالم عودات", "job_no": "30044724", "specialty": "اللغة العربية", "title": "معلم لغة عربية", "password": "30044724"}, {"id": "30041068", "name": "علاء جلال الياس مالح", "job_no": "30041068", "specialty": "اللغة العربية", "title": "معلم لغة عربية", "password": "30041068"}, {"id": "10513658", "name": "عثمان محمد ذياب المصري", "job_no": "10513658", "specialty": "اللغة العربية", "title": "معلم لغة عربية", "password": "10513658"}, {"id": "30040821", "name": "محمد عماد يوسف كيوان", "job_no": "30040821", "specialty": "اللغة العربية", "title": "معلم لغة عربية", "password": "30040821"}, {"id": "10511588", "name": "فادي عبدالله سلمان ثابت", "job_no": "10511588", "specialty": "تربية - نائب مدير مدرسة", "title": "نائب مدير مدرسة", "password": "10511588"}];

function safeJSONParse(key, fallback) {
    try {
        const item = localStorage.getItem(key);
        return item ? JSON.parse(item) : fallback;
    } catch (e) {
        return fallback;
    }
}

let TEACHERS = safeJSONParse('att_teachers', TEACHERS_FALLBACK);
let ATT = safeJSONParse('att_att', []);
let PENDING = safeJSONParse('att_pending', []);
let CONFIG = safeJSONParse('att_cfg', {school_lat:32.5568, school_lng:35.8473, enabled:true, distance:500});
let currentUser = null, role = null;

function save() {
    localStorage.setItem('att_teachers', JSON.stringify(TEACHERS));
    localStorage.setItem('att_att', JSON.stringify(ATT));
    localStorage.setItem('att_pending', JSON.stringify(PENDING));
    localStorage.setItem('att_cfg', JSON.stringify(CONFIG));
}

function toast(m) {
    const t = document.getElementById('toast');
    t.textContent = m;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 3000);
}

function toRad(d) { return d * Math.PI / 180; }
function haversine(a, b, c, d) {
    const R = 6371000;
    const dLat = toRad(c - a), dLon = toRad(d - b);
    const e = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a)) * Math.cos(toRad(c)) * Math.sin(dLon / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(e), Math.sqrt(1 - e));
}

function getPos() {
    return new Promise((res, rej) => {
        if (!navigator.geolocation) return rej('no geo');
        navigator.geolocation.getCurrentPosition(
            p => res({lat: p.coords.latitude, lng: p.coords.longitude}),
            e => { if(e.code === 1) rej('PERMISSION'); else rej('fail'); },
            {enableHighAccuracy: true, timeout: 10000}
        );
    });
}

function login(r) {
    const job = document.getElementById('jobInput').value.trim();
    const pass = document.getElementById('passInput').value.trim();
    const err = document.getElementById('loginError'); 
    err.style.display = 'none';
    
    if (r === 'manager') {
        if (pass === 'admin2026') {
            currentUser = {name: 'لؤي الخطيب', job_no: 'manager'};
            role = 'manager';
            showApp();
        } else {
            err.textContent = 'رمز غير صحيح للمدير';
            err.style.display = 'block';
        }
        return;
    }
    
    const t = TEACHERS.find(x => x.job_no === job && (x.password === pass || x.job_no === pass));
    if (!t) {
        err.textContent = 'بيانات المعلم غير صحيحة';
        err.style.display = 'block';
        return;
    }
    currentUser = t;
    role = 'teacher';
    showApp();
}

function showApp() {
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('appPage').style.display = 'block';
    renderAll(); 
    updateStatus();
    setInterval(syncPending, 10000);
    window.addEventListener('online', () => { toast('عاد الاتصال بالإنترنت'); syncPending(); updateStatus(); });
    window.addEventListener('offline', updateStatus);
}

function switchTab(t, el) {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    if (el) el.classList.add('active');
    
    document.getElementById('teachersTab').style.display = t === 'teachers' ? 'block' : 'none';
    document.getElementById('reportsTab').style.display = t === 'reports' ? 'block' : 'none';
    document.getElementById('locationTab').style.display = t === 'location' ? 'block' : 'none';
    document.getElementById('manageTab').style.display = t === 'manage' ? 'block' : 'none';
    renderAll();
}

async function addAtt(job_no, type, reason) {
    let pos = null, dist = null;
    if (CONFIG.enabled) {
        try {
            pos = await getPos(); 
            dist = Math.round(haversine(pos.lat, pos.lng, CONFIG.school_lat, CONFIG.school_lng)); 
            if (dist > CONFIG.distance) {
                toast('بعيد ' + dist + 'م - المسافة المسموحة ' + CONFIG.distance + 'م');
                return;
            }
        } catch(e) {
            if (e === 'PERMISSION') { toast('يجب السماح بالوصول للموقع أولاً'); return; }
        }
    }
    
    const teacher = TEACHERS.find(t => t.job_no === job_no) || currentUser;
    const rec = {
        id: 'att_' + Date.now() + '_' + job_no, 
        date: new Date().toLocaleDateString('ar-JO'), 
        name: teacher.name, 
        job_no: teacher.job_no, 
        type: type, 
        reason: reason, 
        specialty: teacher.specialty, 
        lat: pos?.lat, 
        lng: pos?.lng, 
        distance: dist
    };
    
    ATT.unshift(rec);
    if (!navigator.onLine) {
        PENDING.push(rec); 
        toast('تم الحفظ محلياً - ستتم المزامنة عند الاتصال');
    } else {
        toast('تم تسجيل ' + type + ' لـ ' + teacher.name);
    }
    save(); 
    renderAll();
    try { localStorage.setItem('att_broadcast', Date.now() + ''); } catch(e){}
}

window.addEventListener('storage', () => { 
    ATT = safeJSONParse('att_att', []); 
    renderAll(); 
});

function syncPending() {
    if (!navigator.onLine || PENDING.length === 0) return; 
    toast('تمت مزامنة ' + PENDING.length + ' سجل بنجاح'); 
    PENDING = []; 
    save(); 
    updateStatus();
}

function updateStatus() {
    const s = document.getElementById('syncStatus'); 
    const p = document.getElementById('pendingInfo');
    if (navigator.onLine) {
        s.textContent = '🟢 متصل - المزامنة نشطة'; 
        p.textContent = PENDING.length ? PENDING.length + ' معلق' : '';
    } else {
        s.textContent = '🔴 غير متصل - يتم الحفظ محلياً'; 
        p.textContent = PENDING.length ? PENDING.length + ' معلق' : '';
    }
    document.getElementById('locInfo').textContent = CONFIG.enabled ? '📍 الموقع مفعل (' + CONFIG.distance + 'م)' : '📍 الموقع معطل';
}

function renderAll() {
    if (!currentUser) return; 
    renderTeachers(); 
    renderReports(); 
    renderLocation(); 
    renderManage();
}

function renderTeachers() {
    const div = document.getElementById('teachersTab');
    let list = role === 'manager' ? TEACHERS : [currentUser];
    let h = `<div class="card"><h4>قائمة المعلمين (${list.length})</h4>`;
    
    list.forEach(t => {
        h += `<div class="teacher-card">
            <div class="teacher-info">
                <b>${t.name}</b>
                <div>${t.specialty} • ${t.title}</div>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
                <button class="btn-green" onclick="addAtt('${t.job_no}','حضور')">حضور</button>
                <button class="btn-yellow" onclick="askReason('${t.job_no}','طارئة')">إجازة طارئة</button>
                <button class="btn-blue-light" onclick="askReason('${t.job_no}','مرضية')">إجازة مرضية</button>
                <button class="btn-orange" onclick="askReason('${t.job_no}','مغادرة')">مغادرة</button>
            </div>
        </div>`;
    });
    
    h += `<div style="margin-top:24px"><h4>سجل اليوم (${ATT.length})</h4>
    <table><tr><th>التاريخ</th><th>الاسم</th><th>النوع</th><th>السبب</th></tr>`;
    ATT.slice(0, 30).forEach(r => {
        h += `<tr><td>${r.date}</td><td>${r.name}</td><td>${r.type}</td><td>${r.reason || '-'}</td></tr>`;
    });
    h += '</table></div></div>'; 
    div.innerHTML = h;
}

function askReason(job, type) {
    const r = prompt('أدخل سبب ( ' + type + ' ):'); 
    if (r !== null) addAtt(job, type, r);
}

    const byType = {};

    <div id="gRep" style="margin-top:15px">
        <div class="grid-2">
            <div class="card" style="margin:0; text-align:center; padding: 15px;">حضور: <b>${byType['حضور']||0}</b><br>إجازة طارئة: <b>${byType['طارئة']||0}</b></div>
            <div class="card" style="margin:0; text-align:center; padding: 15px;">إجازة مرضية: <b>${byType['مرضية']||0}</b><br>مغادرة: <b>${byType['مغادرة']||0}</b></div>
        </div>
        <button class="btn-primary" style="margin-top:15px; width: 100%;" onclick="exportAll()">تصدير السجل الكامل (Excel)</button>
        <table style="margin-top:15px">
            <tr><th>التاريخ</th><th>الاسم</th><th>النوع</th></tr>`;
            
    ATT.slice(0, 100).forEach(r => {
        h += `<tr><td>${r.date}</td><td>${r.name}</td><td>${r.type}</td></tr>`;
    });
    
    h += `</table></div>
    
    <div id="iRep" style="display:none;margin-top:15px">
        <select id="selT" onchange="renderInd()">
            <option value="">-- اختر المعلم لعرض تقريره --</option>`;
            TEACHERS.forEach(t => { h += `<option value="${t.job_no}">${t.name}</option>`; });
    h += `</select><div id="indDiv"></div></div></div>`; 
    
    div.innerHTML = h;
}

function renderInd() {
    const job = document.getElementById('selT').value; 
    if (!job) { document.getElementById('indDiv').innerHTML = ''; return; }
    
    const recs = ATT.filter(r => r.job_no === job); 
    const t = TEACHERS.find(x => x.job_no === job);
    const c = {}; recs.forEach(r => { c[r.type] = (c[r.type] || 0) + 1; });
    
    document.getElementById('indDiv').innerHTML = `
        <div class="card" style="margin-top:15px; background: #f8fafc; border:none; padding:15px;">
            <b style="font-size:16px;">${t.name}</b>
            <div style="font-size:13px; color:#64748b; margin-top:4px;">${t.specialty}</div>
            
            <div class="grid-4">
                <div class="stat-box" style="background:#DCFCE7;color:#166534"><h3>${c['حضور']||0}</h3>حضور</div>
                <div class="stat-box" style="background:#FEF9C3;color:#854D0E"><h3>${c['طارئة']||0}</h3>طارئة</div>
                <div class="stat-box" style="background:#DBEAFE;color:#1E40AF"><h3>${c['مرضية']||0}</h3>مرضية</div>
                <div class="stat-box" style="background:#FFEDD5;color:#9A3412"><h3>${c['مغادرة']||0}</h3>مغادرة</div>
            </div>
            
            <table style="margin-top:15px">
                <tr><th>التاريخ</th><th>النوع</th><th>السبب</th></tr>
                ${recs.map(r => `<tr><td>${r.date}</td><td>${r.type}</td><td>${r.reason || '-'}</td></tr>`).join('')}
            </table>
            
            <button class="btn-primary" style="margin-top:15px; width:100%;" onclick="exportOne('${job}')">تصدير تقرير المعلم (Excel)</button>
        </div>`;
}

function exportAll() {
    let csv = '\uFEFFالتاريخ,الاسم,الرقم الوظيفي,النوع,السبب\n' + ATT.map(r => `"${r.date}","${r.name}","${r.job_no}","${r.type}","${r.reason||''}"`).join('\n');
    download(csv, 'تقرير-الحضور-الشامل.csv');
}

function exportOne(job) {
    let recs = ATT.filter(r => r.job_no === job);
    let csv = '\uFEFFالتاريخ,النوع,السبب\n' + recs.map(r => `"${r.date}","${r.type}","${r.reason||''}"`).join('\n');
    download(csv, 'تقرير-حضور-' + job + '.csv');
}

function download(csv, name) {
    const blob = new Blob([csv], {type: 'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.click();
}

function renderLocation() {
    const div = document.getElementById('locationTab');
    div.innerHTML = `
    <div class="card">
        <h4>إعدادات الموقع الجغرافي للمدرسة</h4>
        <div style="display:grid;gap:15px;margin-top:15px">
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
                <input type="checkbox" id="locEn" style="width:auto; margin:0;" ${CONFIG.enabled ? 'checked' : ''} onchange="CONFIG.enabled=this.checked;save();updateStatus()"> 
                <b>تفعيل التحقق من الموقع عند التسجيل</b>
            </label>
            
            <div>
                <label style="font-size:13px;color:#64748b;margin-bottom:5px;display:block;">المسافة المسموحة (بالمتر):</label>
                <input type="number" id="locDist" value="${CONFIG.distance}">
            </div>
            
            <div class="grid-2">
                <div>
                    <label style="font-size:13px;color:#64748b;margin-bottom:5px;display:block;">خط العرض (Latitude):</label>
                    <input id="locLat" value="${CONFIG.school_lat}"> 
                </div>
                <div>
                    <label style="font-size:13px;color:#64748b;margin-bottom:5px;display:block;">خط الطول (Longitude):</label>
                    <input id="locLng" value="${CONFIG.school_lng}">
                </div>
            </div>
            
            <button class="btn-primary" onclick="CONFIG.distance=parseInt(document.getElementById('locDist').value)||500;CONFIG.school_lat=parseFloat(document.getElementById('locLat').value);CONFIG.school_lng=parseFloat(document.getElementById('locLng').value);save();renderLocation();toast('تم حفظ إعدادات الموقع بنجاح')">حفظ الإعدادات</button>
            
            <hr style="border:none; border-top:1px solid #e2e8f0; margin:10px 0;">
            
            <div class="grid-2">
                <button class="btn-green" onclick="useMy()">استخدام موقعي الحالي كموقع المدرسة</button>
                <button class="btn-gray" onclick="checkDist()">قياس المسافة بيني وبين المدرسة</button>
            </div>
            <div id="distRes" style="font-size:14px; font-weight:700; color:#1E40AF; text-align:center;"></div>
            
            <iframe width="100%" height="300" style="border:1px solid #e2e8f0; border-radius:12px; margin-top:10px;" src="https://www.openstreetmap.org/export/embed.html?bbox=${CONFIG.school_lng-0.005}%2C${CONFIG.school_lat-0.005}%2C${CONFIG.school_lng+0.005}%2C${CONFIG.school_lat+0.005}&layer=mapnik&marker=${CONFIG.school_lat}%2C${CONFIG.school_lng}"></iframe>
        </div>
    </div>`;
}

async function useMy() {
    try {
        const p = await getPos();
        document.getElementById('locLat').value = p.lat;
        document.getElementById('locLng').value = p.lng;
        CONFIG.school_lat = p.lat;
        CONFIG.school_lng = p.lng;
        save();
        renderLocation();
        toast('تم تحديد الموقع بنجاح');
    } catch(e) {
        toast('فشل في تحديد الموقع، يرجى تفعيل الـ GPS');
    }
} 

async function checkDist() {
    try {
        const p = await getPos();
        const d = Math.round(haversine(p.lat, p.lng, CONFIG.school_lat, CONFIG.school_lng));
        document.getElementById('distRes').textContent = 'المسافة الحالية بينك وبين المدرسة: ' + d + ' متر';
    } catch(e) {
        toast('فشل في حساب المسافة، تأكد من إعدادات الموقع');
    }
}

function renderManage() {
    const div = document.getElementById('manageTab');
    if (role !== 'manager') { div.innerHTML = '<div class="card" style="text-align:center; color:#991B1B;">هذه الصفحة مخصصة لمدير المدرسة فقط</div>'; return; }
    
    let h = `<div class="card">
        <h4>إدارة قائمة المعلمين (${TEACHERS.length})</h4>
        <button class="btn-primary" style="margin-top:10px;" onclick="document.getElementById('addF').style.display='block'">+ إضافة معلم جديد</button>
        
        <div id="addF" style="display:none; margin-top:15px; background:#f8fafc; border:1px solid #e2e8f0;" class="card">
            <h4 style="margin-bottom:15px;">بيانات المعلم الجديد</h4>
            <input id="nName" placeholder="الاسم الرباعي">
            <input id="nJob" placeholder="الرقم الوظيفي">
            <input id="nSpec" placeholder="التخصص الدراسي">
            <input id="nTitle" placeholder="المسمى الوظيفي">
            <input id="nPass" placeholder="الرمز السري (اختياري - افتراضياً هو الرقم الوظيفي)" type="password">
            <div class="grid-2" style="margin-top:15px">
                <button class="btn-primary" onclick="saveNew()">حفظ الإضافة</button>
                <button class="btn-gray" onclick="document.getElementById('addF').style.display='none'">إلغاء</button>
            </div>
        </div>
        
        <div style="margin-top:20px">`;
        
    TEACHERS.forEach(t => {
        h += `<div class="teacher-card">
            <div class="teacher-info">
                <b>${t.name}</b>
                <div>${t.job_no} • ${t.specialty}</div>
            </div>
            <div style="display:flex;gap:8px;">
                <button class="btn-gray" onclick="editT('${t.job_no}')">تعديل</button>
                <button class="btn-red" onclick="delT('${t.job_no}')">حذف</button>
            </div>
        </div>`;
    });
    
    h += '</div></div>'; 
    div.innerHTML = h;
}

function saveNew() {
    const name = document.getElementById('nName').value.trim(); 
    const job = document.getElementById('nJob').value.trim();
    const spec = document.getElementById('nSpec').value.trim(); 
    const title = document.getElementById('nTitle').value.trim(); 
    const pass = document.getElementById('nPass').value.trim() || job;
    
    if (!name || !job) { toast('الاسم والرقم الوظيفي حقول مطلوبة'); return; } 
    if (TEACHERS.find(t => t.job_no === job)) { toast('هذا الرقم الوظيفي مسجل مسبقاً'); return; }
    
    TEACHERS.unshift({ name, job_no: job, specialty: spec || 'عام', title: title || 'مدرس', password: pass }); 
    save(); 
    renderAll(); 
    toast('تمت إضافة المعلم بنجاح'); 
    document.getElementById('addF').style.display = 'none';
}

function editT(job) {
    const t = TEACHERS.find(x => x.job_no === job); 
    if (!t) return;
    
    const name = prompt('تعديل الاسم:', t.name); if (name === null) return;
    const njob = prompt('الرقم الوظيفي:', t.job_no); 
    const spec = prompt('التخصص:', t.specialty); 
    const title = prompt('المسمى الوظيفي:', t.title); 
    const pass = prompt('الرمز السري الجديد (اتركه فارغاً لعدم التغيير):', '');
    
    if (name) t.name = name; 
    if (njob) t.job_no = njob; 
    if (spec) t.specialty = spec; 
    if (title) t.title = title; 
    if (pass) t.password = pass;
    
    save(); 
    renderAll(); 
    toast('تم تعديل بيانات المعلم بنجاح');
}

function delT(job) {
    if (!confirm('هل أنت متأكد من حذف هذا المعلم بشكل نهائي؟')) return; 
    TEACHERS = TEACHERS.filter(t => t.job_no !== job); 
    save(); 
    renderAll(); 
    toast('تم الحذف بنجاح');
}
</script>
</body>
</html>
